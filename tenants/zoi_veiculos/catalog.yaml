# Estoque FICTÍCIO da Revenda ZOI — fixture, não é o pátio de ninguém.
#
# 20 veículos (6 suv, 5 hatch, 5 sedan, 4 utilitario), desenhados
# para exercitar o motor de busca:
#   - faixas de preço distintas (widen por preço, over_budget_fallback)
#   - anos escalonados (widen por ano com step -2)
#   - dois itens de preço próximo (corte por diversidade, min_gap_pct)
#   - itens com e sem foto (album_scope)
#   - marcas repetidas (fuzzy por nome/modelo)
#
# SCHEMA (todo veículo tem os mesmos campos, sem exceção):
#   codigo, nome, marca, modelo, versao, categoria, ano, km, cambio,
#   combustivel, cor, valor_brl, descricao, foto_url, fotos,
#   opcionais, unico_dono, ipva_pago, laudo_cautelar, garantia_meses,
#   aceita_troca
#
# PLACA NÃO ENTRA AQUI, de propósito: o redator do Presidio trata placa como
# PII (`_PLATE_RE`) e a rule pii_v4 rejeitaria a bolha que citasse uma. Um
# campo que o agente nunca pode falar é peso morto no payload.
#
# `aceita_troca: false` existe em dois veículos (HAT-005, UTL-004): são
# repasse a preço fechado. Um campo que vale `true` em 20 de 20 linhas não é
# dado, é política de loja — e política de loja mora no FAQ, não no catálogo.

