routine_name: sdr_veiculos

business:
  company: |
    Revenda ZOI — negócio FICTÍCIO, criado para demonstrar o agente.
    Loja de seminovos em Curitiba/PR, pátio com 20 carros entre SUV, hatch,
    sedan e utilitário.
  offer: |
    Atendimento de quem chegou por anúncio: entender o perfil, mostrar o que
    o estoque tem e qualificar a negociação (troca, forma de pagamento e,
    quando é financiamento, os dados da simulação). O fechamento é do
    consultor de pátio.
  scope: |
    O agente apresenta estoque e qualifica. NÃO negocia preço, NÃO dá
    desconto, NÃO avalia o veículo de troca, NÃO aprova financiamento e NÃO
    agenda entrega.

    Escala para humano quando: o cliente pede uma pessoa, quer negociar
    valor, quer saber quanto vale a troca dele, ou reclama de atendimento
    anterior.
  business_rules: |
    - NUNCA citar veículo que não veio da busca no estoque. Se não tem,
      dizer que não tem e oferecer o mais próximo que existe.
    - Preço do anúncio pode ser citado (veio do payload). Desconto, não.
    - Valor de troca é SEMPRE presencial. Nunca estimar por conversa.
    - Financiamento: a aprovação é do banco. Nunca prometer aprovação.
    - CPF e data de nascimento só são pedidos quando o cliente já escolheu
      financiamento. Nunca antes, e nunca repetidos de volta na conversa.
  guarded_signals:
    # `quer_humano` só é aceito com evidência na fala — o extrator tende a
    # disparar escalada em qualquer frase negativa.
    quer_humano:
      - "falar com"
      - "atendente"
      - "vendedor"
      - "pessoa"
      - "humano"
      - "gerente"
      - "reclamar"
      - "reclamação"
      - "desconto"
      - "abatimento"
      - "negociar"
      - "quanto vale"
      - "quanto pagam"
      - "avaliar meu"
  # Slot que dirige um Decide só pode ser setado no nó que o coleta. Sem
  # isto, o extrator preenche `possui_troca: nao` na abertura e o fluxo pula
  # a coleta da troca antes de o cliente ser perguntado — o mesmo bug que
  # originou a rule.
  branch_gating_slots:
    possui_troca: c_troca
    metodo_negociacao: c_negociacao
  # Sem isto a rule catalog_choice_scope fica inerte — ela não adivinha como
  # este roteiro chamou o slot da escolha nem onde a tool gravou o resultado.
  # Mesma lição da rule de agenda na Barbearia: proteção que depende do autor
  # acertar um nome fixo não protege vertical nova.
  escolha_de_item:
    slot: veiculo_escolhido
    payload: estoque
    lista: candidates
    campo_id: codigo
  card_presentation:
    enabled: false
  eval_thresholds:
    process_adherence_min_pct: 80
    response_quality_min_approved_pct: 75
    attack_success_rate_max_pct: 5
