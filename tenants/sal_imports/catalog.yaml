# Catálogo FICTÍCIO — fixture, não é o estoque de ninguém.
#
# Sintetizado no schema real que o motor de busca espera (mesmos nomes de
# campo do `serialize` em config.yaml), para que filtros, scorers, widen,
# diversidade e over-budget sejam exercitados de verdade.
#
# Substitui `source: ghl_products` por catálogo local: a Fase 3.5 do plano
# manda rodar os tenants sem tocar a rede nem o CRM de um cliente ativo.
#
# Desenhado para cobrir os caminhos do motor:
#   - faixas de preço distintas (widen por preço, over_budget_fallback)
#   - potências escalonadas (widen por potência com step -200)
#   - categorias variadas (widen por categoria)
#   - itens com e sem foto (album_scope)
#   - dois itens de preço próximo (diversidade por min_gap_pct)

produtos:
  # ===== scooters =====
  - codigo: "SC-500"
    nome: "Vento 500"
    categoria: "scooter"
    potencia_w: 500
    autonomia_km: 45
    velocidade_kmh: 32
    valor_brl: 4990
    pneu_tipo: "carenada"
    descricao: "Scooter de entrada, leve, para trajeto curto na cidade."
    foto_url: "https://exemplo.invalido/fixture/sc-500.jpg"
    fotos:
      - "https://exemplo.invalido/fixture/sc-500-a.jpg"
      - "https://exemplo.invalido/fixture/sc-500-b.jpg"

  - codigo: "SC-800"
