# Um serviço por bot. Vertical nova = mais um bloco aqui, com o token dela.
#
# Sem porta exposta: o canal é long polling, então o container só faz chamadas
# de saída. Nada de nginx, nada de firewall novo.
#
# Estado em SQLite num volume. A decisão original do plano era Postgres
# próprio; a caixa já roda 8 containers (4 deles Postgres) com ~1,4 GB
# livres, e um quinto banco para um bot de demonstração não se paga. Trocar
# depois é uma linha em app.py — `PostgresDb(db_url=...)`.

services:
  barbearia:
    build: .
    image: zoi-agno:latest
    container_name: zoi_agno_barbearia
    command: ["zoi_barbearia"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - dados_barbearia:/app/.dados
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      # Sem porta exposta, o sinal é o processo vivo. `pgrep` e `ps` NÃO
      # existem na imagem slim — o healthcheck original nunca passaria, e o
      # container ficaria eternamente "health: starting". /proc/1 resolve
      # sem instalar nada.
      test: ["CMD-SHELL", "test -d /proc/1 && grep -q python /proc/1/cmdline"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  veiculos:
    build: .
    image: zoi-agno:latest
    container_name: zoi_agno_veiculos
    command: ["zoi_veiculos"]
    restart: unless-stopped
    env_file: .env
    # Um consumidor por token: cada bot precisa do SEU. `app.py` lê sempre
    # `TELEGRAM_BOT_TOKEN`, então o token deste tenant entra por override do
    # nome da variável — sem tocar o código.
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN_VEICULOS}
    volumes:
      - dados_veiculos:/app/.dados
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "test -d /proc/1 && grep -q python /proc/1/cmdline"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  dados_barbearia:
  dados_veiculos:
