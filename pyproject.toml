[project]
name = "zoi-agno"
version = "0.1.0"
description = "Runtime de agentes conversacionais da ZOI sobre Agno — routine YAML, comandos, fiscalização e executor determinístico"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.0",
    "zoi-routine",
    "litellm>=1.83",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10,<3.0",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.uv.sources]
zoi-routine = { git = "https://github.com/raul-behnke/zoi-routine.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoi_agno"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Módulos portados verbatim do runtime v4. Cada comentário neles documenta um
# bug de produção; reescrevê-los por estilo arrisca perder a cicatriz sem que
# nenhum teste acuse. Só avisos cosméticos são silenciados — bug de verdade
# (F, E) continua valendo.
#
# Precedente: um `ruff --fix` aqui já apagou as aspas de dentro de um
# `Literal[...]` porque o import estava faltando, transformando o tipo em
# nomes indefinidos. Rode `--fix` nestes arquivos com atenção.
[tool.ruff.lint.per-file-ignores]
"src/zoi_agno/sim_nao_normalizer.py" = ["PIE810"]
"src/zoi_agno/enforcement/interrogative_user.py" = ["PIE810"]
"src/zoi_agno/enforcement/slot_validator.py" = ["ISC004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
